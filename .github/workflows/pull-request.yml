name: Pull Request CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pull-request-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Local quality contract
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: TypeScript check
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun run test

      - name: Production engine build
        run: bun run build

      - name: Self-hosted docs build
        run: bun run docs:build

  browser-ssr:
    name: Browser and SSR smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build self-hosted docs
        run: bun run docs:build

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser and SSR smoke test
        run: bun run test:browser

  generated-consumer:
    name: Generated consumer smoke test
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build local package
        run: bun run build

      - name: Run generated consumer smoke test
        run: bun run test:generated

  package:
    name: Package validation
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Validate package artifact
        run: bun run package:check
