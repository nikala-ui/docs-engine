name: Main Branch CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-quality:
    name: Full quality pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run local quality contract
        run: bun run check

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser and SSR smoke test
        run: bun run test:browser

      - name: Run generated consumer smoke test
        run: bun run test:generated

      - name: Validate package artifact
        run: bun run package:check

      - name: Validate bundle sizes
        run: bun run bundle:check

      - name: Create package artifact
        run: mkdir -p .artifacts && bun pm pack --filename .artifacts/nikala-ui-docs.tgz --ignore-scripts

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: .docs-dist
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 14

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: .artifacts/nikala-ui-docs.tgz
          if-no-files-found: error
          retention-days: 14

  netlify-production:
    name: Netlify production deploy
    needs: full-quality
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}

    steps:
      - name: Download documentation artifact
        uses: actions/download-artifact@v4
        with:
          name: docs-dist
          path: .docs-dist

      - name: Deploy production site when Netlify credentials are configured
        run: |
          if [ -z "$NETLIFY_AUTH_TOKEN" ] || [ -z "$NETLIFY_SITE_ID" ]; then
            echo "Netlify production deploy skipped: repository secrets are not configured."
            exit 0
          fi
          npx --yes netlify-cli@17.36.1 deploy \
            --dir=.docs-dist \
            --site="$NETLIFY_SITE_ID" \
            --auth="$NETLIFY_AUTH_TOKEN" \
            --prod
