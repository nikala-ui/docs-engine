name: Main Branch CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-quality:
    name: Full quality pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Run local quality contract
        run: bun run check

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser and SSR smoke test
        run: bun run test:browser

      - name: Run generated consumer smoke test
        run: bun run test:generated

      - name: Validate package artifact
        run: bun run package:check

      - name: Validate bundle sizes
        run: bun run bundle:check

      - name: Create package artifact
        run: mkdir -p .artifacts && bun pm pack --destination .artifacts --filename nikala-ui-docs.tgz --ignore-scripts

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: .docs-dist
          if-no-files-found: error
          retention-days: 14

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: package-tarball
          path: .artifacts/nikala-ui-docs.tgz
          if-no-files-found: error
          retention-days: 14
