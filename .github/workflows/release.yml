name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing version tag to release"
        required: true
        type: string

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  BUN_VERSION: 1.3.14

jobs:
  quality:
    name: Release quality gates
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify tag and package version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          PACKAGE_VERSION="$(node -p "require('./package.json').version")"
          test "$VERSION" = "$PACKAGE_VERSION"

      - name: Run local quality contract
        run: bun run check

      - name: Install Chromium
        run: bunx playwright install --with-deps chromium

      - name: Run browser and SSR smoke test
        run: bun run test:browser

      - name: Run generated consumer smoke test
        run: bun run test:generated

      - name: Validate package artifact
        run: bun run package:check

      - name: Validate bundle sizes
        run: bun run bundle:check

      - name: Create package artifact
        run: mkdir -p .artifacts && bun pm pack --filename .artifacts/nikala-ui-docs.tgz --ignore-scripts

      - name: Upload package artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-package
          path: .artifacts/nikala-ui-docs.tgz
          if-no-files-found: error

  publish:
    name: Publish npm package
    needs: quality
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: write
      id-token: write
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Download package artifact
        uses: actions/download-artifact@v4
        with:
          name: release-package
          path: .artifacts

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - name: Publish with npm provenance
        run: npm publish .artifacts/nikala-ui-docs.tgz --access public --provenance

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag || github.ref_name }}" .artifacts/nikala-ui-docs.tgz --generate-notes

  smoke:
    name: Published package smoke test
    needs: publish
    runs-on: ubuntu-latest

    steps:
      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Wait for npm propagation
        env:
          PACKAGE_VERSION: ${{ inputs.tag && format('{0}', inputs.tag) || github.ref_name }}
        run: |
          VERSION="${PACKAGE_VERSION#v}"
          for attempt in $(seq 1 12); do
            if npm view "@nikala-ui/folio@$VERSION" version >/dev/null 2>&1; then exit 0; fi
            sleep 10
          done
          exit 1

      - name: Install published package in a clean project
        run: |
          VERSION="${{ inputs.tag || github.ref_name }}"
          VERSION="${VERSION#v}"
          mkdir -p /tmp/nikala-release-smoke
          cd /tmp/nikala-release-smoke
          bun init -y
          bun add "@nikala-ui/folio@$VERSION"
          bunx @nikala-ui/folio init .
          bunx @nikala-ui/folio build
